<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/industry-7f4751c8-ea7d-4eab-8fba-3f89d553a6bf/styles.css">
<script src="_ds/industry-7f4751c8-ea7d-4eab-8fba-3f89d553a6bf/_ds_bundle.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600&family=Fira+Sans+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>:root{--font-heading:"Fira Sans Condensed",system-ui,sans-serif;--font-body:"Fira Sans",system-ui,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,monospace}</style>
</helmet>
<div style="display:flex;flex-direction:column;gap:26px;width:100%;font-family:var(--font-body);color:var(--color-text)">
  <div style="display:flex;flex-direction:column;gap:18px">
    <h1 style="margin:0;font-family:var(--font-heading);font-weight:600;font-size:44px;line-height:1;letter-spacing:-.02em">Грамматика</h1>
    <div style="display:flex;border-bottom:1px solid var(--color-divider);font-size:15px">
      <span style="white-space:nowrap;padding:0 2px 12px;margin-right:28px;border-bottom:2px solid var(--color-accent);color:var(--color-accent-800)">Времена</span>
      <span style="white-space:nowrap;padding:0 2px 12px;margin-right:28px;color:var(--color-neutral-700)">Практика времён</span>
      <span style="white-space:nowrap;padding:0 2px 12px;color:var(--color-neutral-700)">Неправильные глаголы</span>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end">
    <div style="font-family:var(--font-heading);font-weight:500;font-size:28px;line-height:1.15;text-wrap:pretty">12 времён — это 4 идеи на 3 осях времени. Учите по одной группе за итерацию.</div>
    <button class="btn btn-primary blueprint" style="height:44px;gap:8px;font-size:16px;padding:0 20px;white-space:nowrap"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>Практика Perfect<dc-import name="Icon" n="arrow" size="16" hint-size="16px,16px"></dc-import></button>
  </div>

  <div style="display:grid;grid-template-columns:96px repeat(4,minmax(0,1fr));border-top:1px solid var(--color-divider);border-left:1px solid var(--color-divider)">
    <div style="border-right:1px solid var(--color-divider);border-bottom:1px solid var(--color-divider)"></div>
    <sc-for list="{{ aspects }}" as="a" hint-placeholder-count="4">
      <div style="padding:14px 16px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--color-divider);border-bottom:1px solid var(--color-divider);background:{{ a.bg }}">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span style="font-family:var(--font-heading);font-weight:600;font-size:20px;white-space:nowrap">{{ a.name }}</span><sc-if value="{{ a.now }}" hint-placeholder-val="{{ false }}"><span style="white-space:nowrap;font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;padding:2px 5px;background:var(--color-accent);color:var(--color-bg)">СЕЙЧАС</span></sc-if></div>
        <span style="font-size:12px;color:var(--color-neutral-700)">{{ a.idea }}</span>
      </div>
    </sc-for>
    <sc-for list="{{ rows }}" as="r" hint-placeholder-count="3">
      <div style="padding:14px 12px;border-right:1px solid var(--color-divider);border-bottom:1px solid var(--color-divider);font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;color:var(--color-neutral-700)">{{ r.time }}</div>
      <sc-for list="{{ r.cells }}" as="c">
        <div style="padding:14px 16px;display:flex;flex-direction:column;gap:6px;cursor:pointer;border-right:1px solid var(--color-divider);border-bottom:1px solid var(--color-divider);background:{{ c.bg }}" style-hover="background:var(--color-accent-200)">
          <span style="white-space:nowrap;font-family:var(--font-mono);font-size:12px;font-weight:500;color:var(--color-accent-800)">{{ c.f }}</span>
          <span style="font-size:13px;font-style:italic;color:var(--color-neutral-800)">{{ c.ex }}</span>
          <div style="display:flex;gap:2px;margin-top:4px"><sc-for list="{{ c.t }}" as="t"><i style="flex:1;height:3px;background:{{ t }}"></i></sc-for></div>
        </div>
      </sc-for>
    </sc-for>
  </div>

  <div style="display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px">
    <div style="display:flex;flex-direction:column;gap:14px">
      <div style="display:flex;align-items:center;gap:16px"><h2 style="margin:0;font-family:var(--font-heading);font-weight:600;font-size:22px;white-space:nowrap">План изучения</h2><div style="flex:1;height:1px;background:var(--color-divider)"></div></div>
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:0">
        <sc-for list="{{ plan }}" as="p" hint-placeholder-count="5">
          <div style="display:flex;flex-direction:column;gap:10px;padding-right:10px">
            <div style="display:flex;align-items:center">
              <span style="width:30px;height:30px;flex:none;display:grid;place-items:center;font-family:var(--font-heading);font-weight:600;font-size:15px;background:{{ p.bg }};color:{{ p.fg }};border:1px {{ p.bs }} {{ p.bc }}">{{ p.n }}</span>
              <i style="flex:1;height:1px;background:{{ p.line }}"></i>
            </div>
            <span style="white-space:nowrap;font-family:var(--font-heading);font-weight:600;font-size:16px;line-height:1.1">{{ p.t }}</span>
            <span style="font-size:12px;color:var(--color-neutral-700)">{{ p.s }}</span>
          </div>
        </sc-for>
      </div>
    </div>
    <div class="blueprint" style="padding:18px 20px;display:flex;flex-direction:column;gap:10px">
      <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
      <span style="white-space:nowrap;font-family:var(--font-heading);font-weight:600;font-size:20px">Как выбрать время</span>
      <sc-for list="{{ decide }}" as="q" hint-placeholder-count="4">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;padding:6px 0;border-top:1px solid color-mix(in srgb,var(--color-text) 8%,transparent)"><span style="text-wrap:pretty">{{ q.q }}</span><span style="flex:none;font-family:var(--font-mono);font-size:11px;padding:2px 6px;background:var(--color-accent-100);color:var(--color-accent-800)">{{ q.a }}</span></div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const A7 = 'var(--color-accent-700)', N = 'var(--color-neutral-300)';
    const ticks = n => Array.from({ length: 5 }, (_, i) => i < n ? (n === 5 ? 'oklch(0.56 0.09 155)' : A7) : N);
    const cur = 2;
    const data = [
      ['НАСТ.', [['V / V+s', 'I work', 5], ['am/is/are + V-ing', 'I am working', 5], ['have/has + V3', 'I have worked', 3], ['have been + V-ing', 'I have been working', 0]]],
      ['ПРОШ.', [['V2', 'I worked', 5], ['was/were + V-ing', 'I was working', 4], ['had + V3', 'I had worked', 2], ['had been + V-ing', 'I had been working', 0]]],
      ['БУД.', [['will + V', 'I will work', 5], ['will be + V-ing', 'I will be working', 3], ['will have + V3', 'I will have worked', 1], ['will have been + V-ing', 'I will have been working', 0]]]
    ];
    const tint = i => i === cur ? 'var(--color-accent-100)' : 'transparent';
    const states = ['done', 'done', 'now', 'next', 'next'];
    const titles = [['Simple', 'Факты и привычки'], ['Continuous', 'Процесс «в кадре»'], ['Perfect', 'Результат к моменту'], ['Perfect Cont.', 'Как долго'], ['Контрасты', 'Сводная по памяти']];
    return {
      aspects: [['Simple', 'факт, привычка'], ['Continuous', 'процесс'], ['Perfect', 'результат'], ['Perfect Continuous', 'длительность']].map(([name, idea], i) => ({ name, idea, now: i === cur, bg: tint(i) })),
      rows: data.map(([time, cells]) => ({ time, cells: cells.map(([f, ex, n], i) => ({ f, ex, t: ticks(n), bg: tint(i) })) })),
      plan: titles.map(([t, s], i) => {
        const st = states[i];
        return { n: i + 1, t, s, bg: st === 'done' ? 'var(--color-accent-700)' : 'transparent', fg: st === 'done' ? 'var(--color-bg)' : st === 'now' ? 'var(--color-accent-800)' : 'var(--color-neutral-600)', bc: st === 'next' ? 'var(--color-neutral-400)' : 'var(--color-accent-700)', bs: st === 'now' ? 'dashed' : 'solid', line: st === 'done' ? 'var(--color-accent-700)' : 'var(--color-neutral-300)' };
      }),
      decide: [
        { q: 'Регулярно, привычка или факт?', a: 'Simple' },
        { q: 'Идёт в конкретный момент?', a: 'Continuous' },
        { q: 'Важен результат, а не когда?', a: 'Perfect' },
        { q: 'Важно, как долго длится?', a: 'Perf. Cont.' }
      ]
    };
  }
}
</script>
</body>
</html>
