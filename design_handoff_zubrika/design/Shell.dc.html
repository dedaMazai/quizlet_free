<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/industry-7f4751c8-ea7d-4eab-8fba-3f89d553a6bf/styles.css">
<script src="_ds/industry-7f4751c8-ea7d-4eab-8fba-3f89d553a6bf/_ds_bundle.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600&family=Fira+Sans+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>:root{--font-heading:"Fira Sans Condensed",system-ui,sans-serif;--font-body:"Fira Sans",system-ui,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,monospace}</style>
</helmet>
<div style="width:100%;height:100%;display:flex;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);overflow:hidden">
  <div style="width:236px;flex:none;border-right:1px solid var(--color-divider);display:flex;flex-direction:column;padding:18px 14px 20px;gap:4px">
    <div style="display:flex;align-items:center;gap:10px;color:var(--color-accent-900);padding:0 0 22px 8px">
      <svg width="20" height="26" viewBox="0 0 24 36" fill="none"><rect x="2" y="9" width="20" height="23" stroke="currentColor" stroke-width="2.4"></rect><line x1="6" y1="16" x2="18" y2="16" stroke="currentColor" stroke-width="2.4"></line><line x1="6" y1="21" x2="18" y2="21" stroke="currentColor" stroke-width="2.4"></line><line x1="6" y1="26" x2="14" y2="26" stroke="currentColor" stroke-width="2.4"></line></svg>
      <span style="white-space:nowrap;font-family:var(--font-heading);font-weight:700;font-size:22px;flex:1">Zubrika</span>
      <button class="btn btn-ghost btn-icon" style="width:30px;height:30px;color:var(--color-neutral-700);white-space:nowrap"><dc-import name="Icon" n="left" size="16" hint-size="16px,16px"></dc-import></button>
    </div>
    <sc-for list="{{ nav }}" as="it" hint-placeholder-count="5">
      <div style="display:flex;align-items:center;gap:12px;height:42px;padding:0 10px;cursor:pointer;font-size:15px;background:{{ it.bg }};color:{{ it.fg }};box-shadow:inset 2px 0 0 {{ it.line }}" style-hover="background:var(--color-accent-100)">
        <dc-import name="Icon" n="{{ it.icon }}" size="18" hint-size="18px,18px"></dc-import>
        <span style="flex:1">{{ it.label }}</span>
        <sc-if value="{{ it.badge }}" hint-placeholder-val="{{ false }}"><span style="white-space:nowrap;font-family:var(--font-mono);font-size:11px;padding:2px 6px;background:var(--color-accent-100);color:var(--color-accent-800)">{{ it.badge }}</span></sc-if>
      </div>
    </sc-for>
    <div style="margin-top:auto;display:flex;flex-direction:column;gap:14px">
      <sc-if value="{{ showCta }}" hint-placeholder-val="{{ true }}">
        <div class="blueprint" style="background:var(--color-accent-900);border-color:var(--color-accent-900);color:var(--color-bg);padding:16px;display:flex;flex-direction:column;gap:10px">
          <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
          <div style="white-space:nowrap;font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;color:var(--color-accent-300)">К ПОВТОРЕНИЮ</div>
          <div style="display:flex;align-items:baseline;gap:8px"><span style="white-space:nowrap;font-family:var(--font-heading);font-weight:600;font-size:40px;line-height:.9">42</span><span style="font-size:13px;color:var(--color-accent-300)">≈ 8 мин</span></div>
          <div style="display:flex;align-items:center;justify-content:center;gap:8px;padding:9px;cursor:pointer;background:var(--color-bg);color:var(--color-accent-900);font-family:var(--font-heading);font-weight:600;font-size:15px" style-hover="background:var(--color-accent-100)">Повторить<dc-import name="Icon" n="arrow" size="14" hint-size="14px,14px"></dc-import></div>
        </div>
      </sc-if>
      <div style="display:flex;align-items:center;gap:10px;padding:4px 6px;cursor:pointer" style-hover="background:var(--color-accent-100)">
        <div style="width:34px;height:34px;flex:none;display:grid;place-items:center;background:var(--color-accent-200);color:var(--color-accent-800);font-family:var(--font-heading);font-weight:600;font-size:14px">ИК</div>
        <div style="display:flex;flex-direction:column;flex:1;min-width:0"><span style="font-size:14px">Илья К.</span><span style="font-size:12px;color:var(--color-neutral-700);white-space:nowrap">Настройки, тема, язык</span></div>
        <dc-import name="Icon" n="down" size="16" hint-size="16px,16px"></dc-import>
      </div>
    </div>
  </div>
  <div style="flex:1;min-width:0;display:flex;flex-direction:column">
    <div style="height:68px;flex:none;display:flex;align-items:center;gap:12px;padding:0 40px">
      <div style="width:420px;max-width:100%;height:40px;display:flex;align-items:center;gap:10px;padding:0 12px;border:1px solid var(--color-divider);color:var(--color-neutral-600)">
        <dc-import name="Icon" n="search" size="16" hint-size="16px,16px"></dc-import>
        <span style="font-size:14px;flex:1">Поиск по колодам и словам</span>
        <span style="white-space:nowrap;font-family:var(--font-mono);font-size:11px;padding:2px 6px;border:1px solid var(--color-divider)">⌘K</span>
      </div>
      <div style="margin-left:auto;display:flex;align-items:center;gap:8px">
        <button class="btn btn-secondary" style="height:40px;gap:8px;font-size:15px;white-space:nowrap"><dc-import name="Icon" n="plus" size="16" hint-size="16px,16px"></dc-import>Колода</button>
        <button class="btn btn-secondary btn-icon" style="width:40px;height:40px;white-space:nowrap"><dc-import name="Icon" n="bell" size="18" hint-size="18px,18px"></dc-import></button>
      </div>
    </div>
    <div style="flex:1;min-height:0;padding:12px 40px 40px;overflow:hidden">
      <sc-if value="{{ s.home }}" hint-placeholder-val="{{ false }}"><dc-import name="Home" streak="{{ streak }}" hint-size="100%,900px"></dc-import></sc-if>
      <sc-if value="{{ s.deck }}" hint-placeholder-val="{{ false }}"><dc-import name="DeckScreen" hint-size="100%,900px"></dc-import></sc-if>
      <sc-if value="{{ s.review }}" hint-placeholder-val="{{ false }}"><dc-import name="ReviewScreen" hint-size="100%,900px"></dc-import></sc-if>
      <sc-if value="{{ s.library }}" hint-placeholder-val="{{ false }}"><dc-import name="LibraryScreen" tab="{{ sub }}" hint-size="100%,900px"></dc-import></sc-if>
      <sc-if value="{{ s.cycles }}" hint-placeholder-val="{{ false }}"><dc-import name="CyclesScreen" view="{{ sub }}" hint-size="100%,900px"></dc-import></sc-if>
      <sc-if value="{{ s.roadmap }}" hint-placeholder-val="{{ false }}"><dc-import name="RoadmapScreen" hint-size="100%,900px"></dc-import></sc-if>
      <sc-if value="{{ s.gx }}" hint-placeholder-val="{{ false }}"><dc-import name="GrammarExtra" view="{{ sub }}" hint-size="100%,900px"></dc-import></sc-if>
      <sc-if value="{{ s.account }}" hint-placeholder-val="{{ false }}"><dc-import name="AccountScreen" tab="{{ sub }}" hint-size="100%,900px"></dc-import></sc-if>
      <sc-if value="{{ s.grammar }}" hint-placeholder-val="{{ false }}"><dc-import name="GrammarScreen" hint-size="100%,900px"></dc-import></sc-if>
      <sc-if value="{{ s.progress }}" hint-placeholder-val="{{ false }}"><dc-import name="ProgressScreen" hint-size="100%,900px"></dc-import></sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:1040},&quot;screen&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;deck&quot;,&quot;review&quot;,&quot;cycles&quot;,&quot;roadmap&quot;,&quot;library&quot;,&quot;grammar&quot;,&quot;gx&quot;,&quot;progress&quot;,&quot;account&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sub&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;learn&quot;,&quot;library&quot;,&quot;grammar&quot;,&quot;progress&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const screen = this.props.screen ?? 'home';
    const active = this.props.active ?? { home: 'home', deck: 'library', library: 'library', review: 'learn', cycles: 'learn', roadmap: 'learn', grammar: 'grammar', gx: 'grammar', progress: 'progress', account: 'none' }[screen];
    const items = [
      { key: 'home', icon: 'house', label: 'Главная' },
      { key: 'learn', icon: 'cap', label: 'Учить', badge: '42' },
      { key: 'library', icon: 'library', label: 'Библиотека' },
      { key: 'grammar', icon: 'book', label: 'Грамматика' },
      { key: 'progress', icon: 'chart', label: 'Прогресс' }
    ];
    const nav = items.map(it => {
      const a = it.key === active;
      return { ...it, bg: a ? 'var(--color-accent-100)' : 'transparent', fg: a ? 'var(--color-accent-800)' : 'var(--color-text)', line: a ? 'var(--color-accent)' : 'transparent' };
    });
    return { nav, s: { [screen]: true }, sub: this.props.sub, streak: this.props.streak ?? 12, showCta: screen !== 'review' };
  }
}
</script>
</body>
</html>
