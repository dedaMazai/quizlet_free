<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/industry-7f4751c8-ea7d-4eab-8fba-3f89d553a6bf/styles.css">
<script src="_ds/industry-7f4751c8-ea7d-4eab-8fba-3f89d553a6bf/_ds_bundle.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600&family=Fira+Sans+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>:root{--font-heading:"Fira Sans Condensed",system-ui,sans-serif;--font-body:"Fira Sans",system-ui,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,monospace}</style>
</helmet>
<div style="display:flex;flex-direction:column;gap:24px;width:100%;font-family:var(--font-body);color:var(--color-text)">
  <div style="display:flex;flex-direction:column;gap:18px">
    <h1 style="margin:0;font-family:var(--font-heading);font-weight:600;font-size:44px;line-height:1;letter-spacing:-.02em">Учить</h1>
    <div style="display:flex;border-bottom:1px solid var(--color-divider);font-size:15px">
      <span style="white-space:nowrap;padding:0 2px 12px;margin-right:28px;color:var(--color-neutral-700);display:flex;gap:8px;align-items:center">К повторению<span style="white-space:nowrap;font-family:var(--font-mono);font-size:11px;padding:1px 5px;background:var(--color-accent-100)">42</span></span>
      <span style="white-space:nowrap;padding:0 2px 12px;margin-right:28px;color:var(--color-neutral-700)">Циклы заучивания</span>
      <span style="white-space:nowrap;padding:0 2px 12px;border-bottom:2px solid var(--color-accent);color:var(--color-accent-800)">Дорожная карта</span>
    </div>
  </div>
  <div class="blueprint" style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;padding:20px 24px">
    <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:baseline;gap:12px"><span style="font-family:var(--font-heading);font-weight:600;font-size:40px;line-height:1">7 <span style="color:var(--color-neutral-600);font-size:26px">/ 20</span></span><span style="font-size:14px;color:var(--color-neutral-800);white-space:nowrap">шагов до цели — уверенный B1</span></div>
      <div style="display:grid;grid-template-columns:repeat(20,1fr);gap:3px"><sc-for list="{{ track }}" as="t" hint-placeholder-count="20"><i style="height:8px;background:{{ t }}"></i></sc-for></div>
    </div>
    <div class="blueprint" style="display:flex;align-items:center;gap:10px;padding:12px 18px;background:var(--color-accent);border-color:var(--color-accent);color:var(--color-bg);font-family:var(--font-heading);font-weight:600;font-size:16px;white-space:nowrap"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>Продолжить: Избранное<dc-import name="Icon" n="arrow" size="16" hint-size="16px,16px"></dc-import></div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--color-divider);border-left:1px solid var(--color-divider)">
    <sc-for list="{{ stages }}" as="s" hint-placeholder-count="4">
      <div style="display:flex;flex-direction:column;border-right:1px solid var(--color-divider);border-bottom:1px solid var(--color-divider);opacity:{{ s.op }}">
        <div style="padding:16px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--color-divider);background:{{ s.bg }};min-height:132px">
          <div style="display:flex;justify-content:space-between;align-items:center"><span style="white-space:nowrap;font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;color:var(--color-neutral-700)">ЭТАП {{ s.n }}</span><span style="white-space:nowrap;font-family:var(--font-mono);font-size:10px;padding:2px 6px;border:1px solid var(--color-accent-400);color:var(--color-accent-800)">{{ s.level }}</span></div>
          <span style="font-family:var(--font-heading);font-weight:600;font-size:20px;line-height:1.1">{{ s.title }}</span>
          <span style="font-size:12px;line-height:1.4;color:var(--color-neutral-700);text-wrap:pretty">{{ s.goal }}</span>
        </div>
        <sc-for list="{{ s.steps }}" as="st">
          <div style="display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-bottom:1px solid color-mix(in srgb,var(--color-text) 6%,transparent);background:{{ st.bg }}">
            <span style="width:20px;height:20px;flex:none;display:grid;place-items:center;margin-top:1px;border:1px {{ st.bs }} {{ st.bc }};background:{{ st.fill }};color:var(--color-bg)"><sc-if value="{{ st.done }}" hint-placeholder-val="{{ false }}"><dc-import name="Icon" n="check" size="12" sw="2.2" hint-size="12px,12px"></dc-import></sc-if></span>
            <div style="display:flex;flex-direction:column;gap:2px;min-width:0">
              <span style="font-size:14px;font-weight:500;line-height:1.25">{{ st.t }}</span>
              <sc-if value="{{ st.here }}" hint-placeholder-val="{{ false }}"><span style="white-space:nowrap;font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;color:var(--color-accent-700)">ВЫ ЗДЕСЬ</span></sc-if>
            </div>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:964,&quot;height&quot;:900}}">
class Component extends DCLogic {
  renderVals() {
    const raw = [
      ['A1', 'Старт: база языка', 'Порядок слов, артикли, предлоги и простые времена.', ['Порядок слов и вопросы', 'Артикли', 'Предлоги времени и места', 'Времена Simple', 'Первая колода слов']],
      ['A1', 'Слова каждый день', 'Запас растёт от коротких ежедневных повторений.', ['К повторению', 'Неправильные глаголы: группа 1', 'Избранное', 'Прогресс']],
      ['A2', 'Расширение грамматики', 'Процессы, модальные глаголы, сравнения.', ['Времена Continuous', 'Модальные глаголы', 'Степени сравнения', 'Практика времён']],
      ['B1', 'Уверенный уровень', 'Perfect, условные предложения и пассив.', ['Времена Perfect', 'Perfect Continuous', 'Условные предложения', 'Пассивный залог', 'Неправильные глаголы: 2–3', 'Практика с ИИ']]
    ];
    let idx = 0; const DONE = 7;
    const stages = raw.map(([level, title, goal, steps], si) => {
      const list = steps.map(t => {
        const i = idx++; const done = i < DONE, here = i === DONE;
        return { t, done, here, fill: done ? 'oklch(0.56 0.09 155)' : 'transparent', bc: done ? 'oklch(0.56 0.09 155)' : here ? 'var(--color-accent)' : 'var(--color-neutral-400)', bs: here ? 'dashed' : 'solid', bg: here ? 'var(--color-accent-100)' : 'transparent' };
      });
      return { n: si + 1, level, title, goal, steps: list, op: si >= 2 ? 0.75 : 1, bg: si === 1 ? 'var(--color-accent-100)' : si === 0 ? 'oklch(0.95 0.03 155)' : 'transparent' };
    });
    return { stages, track: Array.from({ length: 20 }, (_, i) => i < DONE ? 'oklch(0.56 0.09 155)' : i === DONE ? 'var(--color-accent-400)' : 'var(--color-neutral-300)') };
  }
}
</script>
</body>
</html>
